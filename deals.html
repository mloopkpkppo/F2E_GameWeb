<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101322" />
    <meta
      name="description"
      content="在 PIXEL QUEST 探索 Steam 與獨立遊戲，閱讀介紹、查看台灣區優惠與玩家評價。"
    />
    <title>特價優惠｜PIXEL QUEST</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body data-page="deals">
    <a class="skip" href="#main-content">跳至主要內容</a>
    <header class="header">
      <div class="nav-wrap">
        <a class="brand" href="/" aria-label="PIXEL QUEST 首頁"
          ><span class="brand-icon" aria-hidden="true">✚</span
          ><span>PIXEL<span class="lime">QUEST</span></span></a
        >
        <nav aria-label="主要選單">
          <a href="/games" class="nav-link">遊戲探索</a
          ><a href="/indie" class="nav-link">獨立遊戲<span class="nav-dot"></span></a
          ><a href="/deals" class="nav-link active" aria-current="page">特價優惠</a
          ><a href="/community" class="nav-link">玩家評價</a>
        </nav>
        <div class="nav-actions">
          <a id="steam-nav" class="steam-nav" href="/account">Steam 帳號 ↗</a
          ><a id="saved-nav" class="saved-nav" href="/games?filter=saved"
            ><span aria-hidden="true">♡</span> 收藏清單 <b id="saved-count">0</b></a
          >
        </div>
      </div>
    </header>
    <main id="main-content">
      <section id="deals" class="section container">
        <div class="section-heading">
          <div>
            <h1>特價優惠</h1>
            <p>查看已收錄作品的台灣區折扣與價格。</p>
          </div>
          <span class="region-label">TW 台灣區 · TWD</span>
        </div>
        <div class="results-line">
          <p id="data-status" class="data-status" role="status">正在取得 Steam 台灣區價格…</p>
          <button id="refresh" class="subtle-button">↻ 更新商店資料</button>
        </div>
        <div id="deals-grid" class="deals-grid">
          <div class="empty"><p>正在尋找目前的優惠…</p></div>
        </div>
        <p class="fine-print">
          僅顯示本頁收錄作品中已取得的折扣；不是全站最低價或歷史低價。未提供優惠截止時間的作品不顯示倒數。
        </p>
      </section>
    </main>
    <footer class="container footer">
      <a class="brand" href="/"
        ><span class="brand-icon" aria-hidden="true">✚</span
        ><span>PIXEL<span class="lime">QUEST</span></span></a
      >
      <span>獨立遊戲探索專案 · V1.0<br />非 Valve 或 Steam 官方網站</span>
    </footer>
    <dialog id="game-dialog" aria-labelledby="dialog-title">
      <div id="dialog-content"></div>
      <button id="close-dialog" class="close-dialog" aria-label="關閉遊戲介紹">✕</button>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
